name: Deploy Frontend to Azure VM

on:
  push:
    branches: [ "main", "develop" ] # Triggers the pipeline when pushing to main, develop branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push UI Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gatherly-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH into Azure VM and Run Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Stop and remove the old running UI container if it exists
            docker stop gatherly-frontend-container || true
            docker rm gatherly-frontend-container || true
            
            # 2. Force pull the fresh image directly from Docker Hub onto the VM
            docker pull ${{ secrets.DOCKER_USERNAME }}/gatherly-ui:latest
            
            # 3. Run the container on Port 80, detached, with automatic restart policy
            docker run --name gatherly-frontend-container \
              -p 80:80 \
              -d --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/gatherly-ui:latest
