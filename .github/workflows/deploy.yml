name: Deploy Frontend to Azure VM

on:
  push:
    branches: [ "main", "develop" ] # Triggers the pipeline when pushing to main or develop branches

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push UI Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gatherly-ui:latest
          # INJECT THE BACKEND LINK: Dynamic build-arg mapping to your VM IP
          build-args: |
            VITE_API_URL=${{ secrets.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH into Azure VM and Deploy via Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # 1. Step into your isolated frontend environment folder on the VM
            cd /home/${{ secrets.VM_USER }}/gatherly-frontend
            
            # 2. Pull down the fresh image built with the injected API endpoint
            docker compose pull
            
            # 3. Spin up the container seamlessly via Option B Compose architecture
            docker compose up -d
