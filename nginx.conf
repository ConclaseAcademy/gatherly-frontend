events { worker_connections 1024; }

http {
    # CRITICAL: Inclusion of mime.types ensures your browser renders 
    # CSS and JS correctly instead of blocking them as plain text.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        
        # 1. Serve the compiled static assets directly from disk
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Route API requests over to the .NET backend container
        location /api/ {
            # FIX: Using the correct internal docker-compose service name
            proxy_pass http://gatherly-api:8080; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
